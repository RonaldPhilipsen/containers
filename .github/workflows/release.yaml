---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  push:
    branches:
      - main
    paths:
      - apps/**
  workflow_dispatch:
    inputs:
      app:
        type: string
        description: App Name
        required: true
      release:
        type: boolean
        description: Release
        required: false
        default: false
      no-cache:
        type: boolean
        description: No Cache
        required: false
        default: false

permissions:
  contents: read

jobs:
  changed:
    name: Get Changed Apps
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get Apps
        id: apps
        env:
          EVENT: ${{ github.event_name }}
          INPUT_APP: ${{ inputs.app }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
              [[ -d "apps/${INPUT_APP}" ]] || { echo "::error::apps/${INPUT_APP} not found"; exit 1; }
              APPS="$INPUT_APP"
          elif [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              APPS=$(find apps -mindepth 1 -maxdepth 1 -type d -printf '%f\n')
          else
              APPS=$(git diff --name-only "$BEFORE" "$SHA" -- apps/ | cut -d/ -f2 | sort -u)
          fi
          JSON=$(for a in $APPS; do [[ -d "apps/$a" ]] && echo "$a"; done | jq --raw-input --slurp --compact-output 'split("\n") | map(select(length > 0))')
          echo "apps=${JSON}" >> "$GITHUB_OUTPUT"
          echo "apps: ${JSON}"

  build:
    if: ${{ needs.changed.outputs.apps != '[]' }}
    name: Build ${{ matrix.app }}
    needs:
      - changed
    uses: $/.github/workflows/app-builder.yaml
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      matrix:
        app: ${{ fromJSON(needs.changed.outputs.apps) }}
      fail-fast: false
    with:
      app: ${{ matrix.app }}
      no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.no-cache }}
      release: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release) }}

  status:
    if: ${{ !cancelled() }}
    name: Build Success
    needs:
      - build
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: All jobs passed or skipped
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: echo "All jobs passed or skipped"
